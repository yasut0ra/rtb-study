<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="セカンドプライスとファーストプライスの支払額の違い" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif">
<title>セカンドプライスとファーストプライスの支払額の違い</title>
<defs>
<marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker>
<marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="ah-buy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker>
<marker id="ah-sell" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
<marker id="ah-market" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
<marker id="ah-alert" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="ah-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
</defs>
<rect x="0.5" y="0.5" width="759" height="329" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<line x1="70" y1="280.0" x2="370" y2="280.0" stroke="#cbd5e1" stroke-width="1"/>
<text x="62" y="280.0" font-size="11" fill="#64748b" text-anchor="end" font-weight="400" dominant-baseline="middle" >0</text>
<line x1="70" y1="236.0" x2="370" y2="236.0" stroke="#cbd5e1" stroke-width="1"/>
<text x="62" y="236.0" font-size="11" fill="#64748b" text-anchor="end" font-weight="400" dominant-baseline="middle" >100</text>
<line x1="70" y1="192.0" x2="370" y2="192.0" stroke="#cbd5e1" stroke-width="1"/>
<text x="62" y="192.0" font-size="11" fill="#64748b" text-anchor="end" font-weight="400" dominant-baseline="middle" >200</text>
<line x1="70" y1="148.0" x2="370" y2="148.0" stroke="#cbd5e1" stroke-width="1"/>
<text x="62" y="148.0" font-size="11" fill="#64748b" text-anchor="end" font-weight="400" dominant-baseline="middle" >300</text>
<line x1="70" y1="104.0" x2="370" y2="104.0" stroke="#cbd5e1" stroke-width="1"/>
<text x="62" y="104.0" font-size="11" fill="#64748b" text-anchor="end" font-weight="400" dominant-baseline="middle" >400</text>
<line x1="70" y1="60.0" x2="370" y2="60.0" stroke="#cbd5e1" stroke-width="1"/>
<text x="62" y="60.0" font-size="11" fill="#64748b" text-anchor="end" font-weight="400" dominant-baseline="middle" >500</text>
<text x="62" y="44" font-size="11" fill="#64748b" text-anchor="end" font-weight="400" dominant-baseline="middle" >円 CPM</text>
<rect x="90" y="148.0" width="64" height="132.0" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="122" y="134.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700" dominant-baseline="middle" >300 円</text>
<text x="122" y="296" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400" dominant-baseline="middle" >DSP A</text>
<rect x="188" y="82.0" width="64" height="198.0" rx="4" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
<text x="220" y="68.0" font-size="13" fill="#312e81" text-anchor="middle" font-weight="700" dominant-baseline="middle" >450 円</text>
<text x="220" y="296" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400" dominant-baseline="middle" >DSP B</text>
<rect x="286" y="192.0" width="64" height="88.0" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="318" y="178.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700" dominant-baseline="middle" >200 円</text>
<text x="318" y="296" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400" dominant-baseline="middle" >DSP C</text>
<text x="220" y="48.0" font-size="11" fill="#312e81" text-anchor="middle" font-weight="700" dominant-baseline="middle" >最高額</text>
<line x1="70" y1="236.0" x2="370" y2="236.0" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
<text x="372" y="236.0" font-size="11" fill="#dc2626" text-anchor="start" font-weight="700" dominant-baseline="middle" >フロア 100 円</text>
<rect x="460" y="36" width="280" height="118" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="480" y="60" font-size="14" fill="#064e3b" text-anchor="start" font-weight="700" dominant-baseline="middle" >セカンドプライス</text>
<text x="480" y="96" font-size="12" fill="#1e293b" text-anchor="start" font-weight="400" dominant-baseline="middle" >DSP B が落札し、支払うのは</text>
<text x="720" y="96" font-size="22" fill="#064e3b" text-anchor="end" font-weight="700" dominant-baseline="middle" >301 円</text>
<text x="480" y="130" font-size="12" fill="#64748b" text-anchor="start" font-weight="400" dominant-baseline="middle" >2 位（300 円）＋ 1 円</text>
<rect x="460" y="176" width="280" height="118" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="480" y="200" font-size="14" fill="#78350f" text-anchor="start" font-weight="700" dominant-baseline="middle" >ファーストプライス（現在の主流）</text>
<text x="480" y="236" font-size="12" fill="#1e293b" text-anchor="start" font-weight="400" dominant-baseline="middle" >DSP B が落札し、支払うのは</text>
<text x="720" y="236" font-size="22" fill="#78350f" text-anchor="end" font-weight="700" dominant-baseline="middle" >450 円</text>
<text x="480" y="270" font-size="12" fill="#64748b" text-anchor="start" font-weight="400" dominant-baseline="middle" >自分の入札額をそのまま支払う</text>
</svg>
