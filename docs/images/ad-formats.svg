<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" role="img" aria-label="広告フォーマットの違い：バナー・ネイティブ・動画">
  <style>
    .phone{fill:#ffffff;stroke:#334155;stroke-width:3}
    .line{fill:#cbd5e1}
    .ad{fill:#3b82f6}
    .title{font-size:17px;font-weight:700;fill:#0f172a}
    .sub{font-size:13px;fill:#334155}
    .w{fill:#ffffff;font-size:13px;font-weight:700}
    .pr{font-size:10px;fill:#64748b}
  </style>
  <rect width="720" height="330" fill="#f8fafc"/>

  <!-- Banner -->
  <g transform="translate(40,20)">
    <text class="title" x="90" y="16" text-anchor="middle">バナー</text>
    <rect class="phone" x="15" y="30" width="150" height="230" rx="16"/>
    <rect class="line" x="30" y="50" width="120" height="9" rx="3"/>
    <rect class="line" x="30" y="66" width="100" height="9" rx="3"/>
    <rect class="line" x="30" y="82" width="115" height="9" rx="3"/>
    <rect class="ad" x="30" y="105" width="120" height="100" rx="4"/>
    <text class="w" x="90" y="160" text-anchor="middle">300×250</text>
    <rect class="line" x="30" y="220" width="110" height="9" rx="3"/>
    <text class="sub" x="90" y="285" text-anchor="middle">決まったサイズの画像・HTML</text>
    <text class="sub" x="90" y="303" text-anchor="middle">adm = HTML</text>
  </g>

  <!-- Native -->
  <g transform="translate(270,20)">
    <text class="title" x="90" y="16" text-anchor="middle">ネイティブ</text>
    <rect class="phone" x="15" y="30" width="150" height="230" rx="16"/>
    <rect fill="#e2e8f0" x="30" y="50" width="40" height="40" rx="4"/>
    <rect class="line" x="78" y="55" width="72" height="9" rx="3"/>
    <rect class="line" x="78" y="72" width="55" height="9" rx="3"/>
    <rect fill="#dbeafe" stroke="#3b82f6" stroke-width="2" x="26" y="102" width="128" height="52" rx="4"/>
    <rect class="ad" x="32" y="108" width="40" height="40" rx="4"/>
    <rect fill="#1e3a8a" x="80" y="113" width="66" height="9" rx="3"/>
    <rect fill="#93c5fd" x="80" y="128" width="50" height="8" rx="3"/>
    <text class="pr" x="146" y="148" text-anchor="end">PR</text>
    <rect fill="#e2e8f0" x="30" y="166" width="40" height="40" rx="4"/>
    <rect class="line" x="78" y="171" width="72" height="9" rx="3"/>
    <rect class="line" x="78" y="188" width="60" height="9" rx="3"/>
    <text class="sub" x="90" y="285" text-anchor="middle">記事一覧になじむ見た目</text>
    <text class="sub" x="90" y="303" text-anchor="middle">adm = 部品の JSON</text>
  </g>

  <!-- Video -->
  <g transform="translate(500,20)">
    <text class="title" x="90" y="16" text-anchor="middle">動画</text>
    <rect class="phone" x="15" y="30" width="150" height="230" rx="16"/>
    <rect fill="#0f172a" x="30" y="55" width="120" height="80" rx="4"/>
    <polygon fill="#ffffff" points="80,78 80,112 108,95"/>
    <rect fill="#f59e0b" x="30" y="128" width="50" height="7"/>
    <text class="w" x="146" y="70" text-anchor="end" font-size="10">広告 0:15</text>
    <rect class="line" x="30" y="150" width="120" height="9" rx="3"/>
    <rect class="line" x="30" y="166" width="95" height="9" rx="3"/>
    <text class="sub" x="90" y="285" text-anchor="middle">本編の前後・途中に再生</text>
    <text class="sub" x="90" y="303" text-anchor="middle">adm = VAST（XML）</text>
  </g>
</svg>
