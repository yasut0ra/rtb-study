<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="RTB の登場人物と、お金・広告枠の流れ" font-family="'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif">
<title>RTB の登場人物と、お金・広告枠の流れ</title>
<defs>
<marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker>
<marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="ah-buy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker>
<marker id="ah-sell" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
<marker id="ah-market" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
<marker id="ah-alert" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="ah-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
</defs>
<rect x="0.5" y="0.5" width="759" height="339" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="160" y="34" font-size="13" fill="#312e81" text-anchor="middle" font-weight="700" dominant-baseline="middle" >買い手側（Buy Side）</text>
<text x="380" y="34" font-size="13" fill="#78350f" text-anchor="middle" font-weight="700" dominant-baseline="middle" >取引所</text>
<text x="600" y="34" font-size="13" fill="#064e3b" text-anchor="middle" font-weight="700" dominant-baseline="middle" >売り手側（Sell Side）</text>
<line x1="70" y1="66" x2="690" y2="66" stroke="#16a34a" stroke-width="2" marker-end="url(#ah-good)"/>
<rect x="312.0" y="54" width="136.0" height="24" rx="12" fill="#f0fdf4" stroke="#16a34a"/><text x="380" y="66" font-size="12" fill="#14532d" text-anchor="middle" font-weight="700" dominant-baseline="middle" >お金（広告費）の流れ</text>
<rect x="20" y="104" width="112" height="64" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
<text x="76.0" y="128.3" font-size="14" fill="#312e81" text-anchor="middle" font-weight="700" dominant-baseline="middle" >広告主</text>
<text x="76.0" y="146.5" font-size="12" fill="#312e81" text-anchor="middle" font-weight="400" dominant-baseline="middle" >広告代理店</text>
<rect x="172" y="104" width="112" height="64" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
<text x="228.0" y="126.1" font-size="18" fill="#312e81" text-anchor="middle" font-weight="700" dominant-baseline="middle" >DSP</text>
<text x="228.0" y="149.5" font-size="16" fill="#312e81" text-anchor="middle" font-weight="400" dominant-baseline="middle" >入札する</text>
<rect x="324" y="104" width="112" height="64" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="380.0" y="128.3" font-size="14" fill="#78350f" text-anchor="middle" font-weight="700" dominant-baseline="middle" >アドエクス</text>
<text x="380.0" y="146.5" font-size="12" fill="#78350f" text-anchor="middle" font-weight="400" dominant-baseline="middle" >チェンジ</text>
<rect x="476" y="104" width="112" height="64" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="532.0" y="126.1" font-size="18" fill="#064e3b" text-anchor="middle" font-weight="700" dominant-baseline="middle" >SSP</text>
<text x="532.0" y="149.5" font-size="16" fill="#064e3b" text-anchor="middle" font-weight="400" dominant-baseline="middle" >入札を募る</text>
<rect x="628" y="104" width="112" height="64" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="684.0" y="128.3" font-size="14" fill="#064e3b" text-anchor="middle" font-weight="700" dominant-baseline="middle" >媒体社</text>
<text x="684.0" y="146.5" font-size="12" fill="#064e3b" text-anchor="middle" font-weight="400" dominant-baseline="middle" >サイト・アプリ</text>
<line x1="138" y1="136.0" x2="166" y2="136.0" stroke="#1e293b" stroke-width="2" marker-start="url(#ah-ink)" marker-end="url(#ah-ink)"/>
<line x1="290" y1="136.0" x2="318" y2="136.0" stroke="#1e293b" stroke-width="2" marker-start="url(#ah-ink)" marker-end="url(#ah-ink)"/>
<line x1="442" y1="136.0" x2="470" y2="136.0" stroke="#1e293b" stroke-width="2" marker-start="url(#ah-ink)" marker-end="url(#ah-ink)"/>
<line x1="594" y1="136.0" x2="622" y2="136.0" stroke="#1e293b" stroke-width="2" marker-start="url(#ah-ink)" marker-end="url(#ah-ink)"/>
<line x1="690" y1="202" x2="70" y2="202" stroke="#059669" stroke-width="2" marker-end="url(#ah-sell)"/>
<rect x="276.0" y="190" width="208.0" height="24" rx="12" fill="#ecfdf5" stroke="#059669"/><text x="380" y="202" font-size="12" fill="#064e3b" text-anchor="middle" font-weight="700" dominant-baseline="middle" >広告枠（インプレッション）の流れ</text>
<rect x="168" y="240" width="120" height="54" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" stroke-dasharray="6 4"/>
<text x="228.0" y="259.85" font-size="13" fill="#312e81" text-anchor="middle" font-weight="700" dominant-baseline="middle" >DMP / CDP</text>
<text x="228.0" y="276.75" font-size="11" fill="#312e81" text-anchor="middle" font-weight="400" dominant-baseline="middle" >ユーザーデータ</text>
<line x1="228" y1="240" x2="228" y2="172" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah-buy)"/>
<rect x="624" y="240" width="120" height="54" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="684.0" y="259.85" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700" dominant-baseline="middle" >ユーザー</text>
<text x="684.0" y="276.75" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="400" dominant-baseline="middle" >ページを見る人</text>
<line x1="684" y1="240" x2="684" y2="172" stroke="#64748b" stroke-width="1.5" marker-start="url(#ah-muted)" marker-end="url(#ah-muted)"/>
<text x="380" y="318" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" dominant-baseline="middle" >1 回の表示ごとに、この流れが約 0.1 秒で完了する</text>
</svg>
