site_name: RTB 入門 — デジタル広告の仕組みを図解で学ぶ
site_description: リアルタイム入札（RTB）の仕組みを、図とたとえ話でゼロから学ぶ学習資料
docs_dir: docs

theme:
  name: material
  language: ja
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切り替え
  icon:
    logo: material/gavel

nav:
  - ホーム: index.md
  - 基礎:
      - 1. デジタル広告の全体像: 01-overview.md
      - 2. RTB の流れ: 02-rtb-flow.md
      - 3. OpenRTB プロトコル: 03-openrtb.md
  - 仕組みと戦略:
      - 4. オークション方式: 04-auction.md
      - 5. DSP の入札ロジック: 05-dsp-bidding.md
      - 6. 取引形態: 06-deals.md
  - 周辺の課題:
      - 7. プライバシーと識別子: 07-privacy.md
      - 8. 透明性・品質・不正対策: 08-quality-fraud.md
      - 9. 指標と計算式: 09-metrics.md
  - 用語集: glossary.md
  - 確認問題: quiz.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
